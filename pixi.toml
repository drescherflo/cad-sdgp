# Defines the pixi environments for the SDGP
[workspace]
name = "sodah-sdgp"
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", glibc = "2.35" }] # isaacsim only ships manylinux_2_35 wheels (Ubuntu 22.04+)

# --- SDGP: the Isaac Sim pipeline (default environment) ---
# Isaac Sim pins several of its dependencies to exact versions. Anything it pins is resolved on the
# PyPI side so uv can honour those pins; the conda side is kept to what actually needs conda.
[feature.sdgp.dependencies]
python = "3.11.*"
# conda-only package - the reason a conda channel is needed at all. The novtk build is used because
# the "all" build pulls in VTK -> wslink -> aiohttp -> propcache, which collides with isaacsim-kernel's
# propcache==0.2.1. Only OCC.Extend.DataExchange is used, which does not touch VTK.
pythonocc-core = { version = "7.9.*", build = "novtk_*" }
numpy = "==1.26.0"     # pythonocc-core pulls in a conda numpy, which must match isaacsim-kernel's numpy==1.26.0
pyparsing = "==3.0.9"  # pythonocc-core -> svgwrite pulls in a conda pyparsing, which must match isaacsim-core's pyparsing==3.0.9
json5 = "0.12.*"

[feature.sdgp.pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]

[feature.sdgp.pypi-dependencies]
isaacsim = { version = "==5.1.0", extras = ["all", "extscache"] }
scikit-learn = "~=1.3.2" # resolved via PyPI: the conda build depends on conda scipy, which cannot be the 1.15.3 isaacsim-core requires
numpy-stl = "~=3.2.0"
pillow = "*"  # direct import (PIL); exact version pinned by isaacsim-kernel (11.3.0)
trimesh = "*" # direct import; exact version pinned by isaacsim-core (4.5.1)

# --- Paper reproduction: evaluation scripts, no Isaac Sim ---
# Kept separate because these pins conflict with the ones Isaac Sim requires
# (matplotlib 3.8 vs 3.10, scipy 1.13 vs 1.15, pandas 2.2 vs 2.3).
[feature.paper-repro.dependencies]
python = "3.11.*"

[feature.paper-repro.pypi-dependencies]
numpy = "~=1.26.3"
matplotlib = "~=3.8.3"
pandas = "~=2.2.1"
scipy = "~=1.13.0"
torch = "~=2.9.1"
torchvision = "~=0.24.1"
opencv-python = "~=4.11.0"

[environments]
default = { features = ["sdgp"] }
paper-repro = { features = ["paper-repro"], no-default-feature = true }
