# Defines the conda environment for the SDGP
name: sodah-sdgp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=1.26.*
  - pillow=11.3.*
  - scipy=1.16.*
  - trimesh=4.7.*
  - pythonocc-core=7.9.*
  - scikit-learn=1.3.*
  - json5=0.12.*
  - pandas=2.3.*
  - matplotlib=3.10.*
  - pip:
    - numpy-stl~=3.2.0
    - numpy-quaternion~=2023.0.3
    - --extra-index-url https://pypi.nvidia.com
    - isaacsim[all,extscache]==5.0.0
